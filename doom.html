<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doomsday Countdown</title>
    <link rel="stylesheet" href="doom.css">
</head>
<body><div class="container">

    <div class="countdown">
        <h1>DOOMSDAY IS COMING</h1>

        <div class="timer">
            <div>
                <span id="months">01</span>
                <p>MONTHS</p>
            </div>
            
            <span class="colon">:</span>

            <div>
                <span id="days">16</span>
                <p>DAYS</p>
            </div>

            <span class="colon">:</span>                            

            <div>
                <span id="hours">22</span>
                <p>HOURS</p>
            </div>

            <span class="colon">:</span>

            <div>
                <span id="minutes">58</span>
                <p>MINUTES</p>
            </div>

            <span class="colon">:</span>
            
            <div>
                <span id="seconds">16</span>
                <p>SECONDS</p>
            </div>
        </div>
    </div>

</div>

<script src="doom.js"></script>

</body>
</html>
